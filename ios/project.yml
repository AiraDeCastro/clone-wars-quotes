name: ColdOpen
options:
  bundleIdPrefix: com.coldopen
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  ColdOpenCore:
    path: ColdOpenCore

targets:
  ColdOpen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColdOpen
      - path: AppIcon.xcassets
    dependencies:
      - package: ColdOpenCore
      - target: ColdOpenWidgetExtension
        embed: true
    info:
      path: ColdOpen/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldopen.app
        PRODUCT_NAME: "Cold Open"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false

  ColdOpenWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColdOpenWidget
    dependencies:
      - package: ColdOpenCore
    info:
      path: ColdOpenWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldopen.app.widget
        PRODUCT_NAME: "Cold Open Widget"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        # CODE_SIGN_ENTITLEMENTS references the App Group used to persist
        # QuoteSelector's "already shown" state — the file exists, but the
        # App Group itself isn't registered anywhere yet (Signing &
        # Capabilities, tied to a real Apple ID). See ColdOpenWidget.swift's
        # WidgetAppGroup doc comment and ios/README.md.
        CODE_SIGN_ENTITLEMENTS: ColdOpenWidget/ColdOpenWidget.entitlements

  # macOS targets below compile the SAME ColdOpen/ and ColdOpenWidget/
  # source directories as the iOS targets above — not a copy. Nothing in
  # those Swift files is iOS-only (verified by inspection: plain
  # SwiftUI/WidgetKit/Foundation, no #if os(iOS)), so this is genuine
  # shared-code reuse per PLANNING.md's "macOS: WidgetKit (shared with
  # iOS)" architecture note, not just a shared corpus/schema.
  ColdOpenMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ColdOpen
      - path: AppIcon.xcassets
    dependencies:
      - package: ColdOpenCore
      - target: ColdOpenWidgetExtensionMac
        embed: true
    info:
      path: ColdOpenMac/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldopen.mac.app
        PRODUCT_NAME: "Cold Open"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true

  ColdOpenWidgetExtensionMac:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ColdOpenWidget
    dependencies:
      - package: ColdOpenCore
    info:
      path: ColdOpenWidgetMac/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldopen.mac.app.widget
        PRODUCT_NAME: "Cold Open Widget"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: ColdOpenWidgetMac/ColdOpenWidgetMac.entitlements
