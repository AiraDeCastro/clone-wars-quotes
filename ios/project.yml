name: ColdOpen
options:
  bundleIdPrefix: com.coldopen
  deploymentTarget:
    iOS: "17.0"

packages:
  ColdOpenCore:
    path: ColdOpenCore

targets:
  ColdOpen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColdOpen
    dependencies:
      - package: ColdOpenCore
      - target: ColdOpenWidgetExtension
        embed: true
    info:
      path: ColdOpen/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldopen.app
        PRODUCT_NAME: "Cold Open"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false

  ColdOpenWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ColdOpenWidget
    dependencies:
      - package: ColdOpenCore
    info:
      path: ColdOpenWidget/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.coldopen.app.widget
        PRODUCT_NAME: "Cold Open Widget"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
